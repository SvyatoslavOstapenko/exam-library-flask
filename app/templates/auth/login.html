{% extends 'base.html' %}

{% block title %}Вход | Электронная библиотека{% endblock %}

{% block content %}
<div class="container">
    <form class="mx-auto bg-white p-5 border rounded shadow-sm" method="POST" style="max-width: 30rem;">
        <h2 class="mb-4 text-center">Вход</h2>

        <div class="form-floating mb-3">
            <input autocomplete="off" type="text" class="form-control" name="login" id="login"
                   placeholder="Логин" value="{{ request.form.login }}" required>
            <label for="login">Логин</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Пароль" required>
            <label for="password">Пароль</label>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label" for="remember">
                Запомнить меня
            </label>
        </div>

        <button type="submit" class="btn btn-dark w-100">Войти</button>
    </form>
</div>
{% endblock %}
