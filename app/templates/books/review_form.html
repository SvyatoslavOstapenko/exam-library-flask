{% extends 'base.html' %}

{% block title %}Новая рецензия | Электронная библиотека{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Рецензия на книгу «{{ book.title }}»</h1>

    <form method="POST" action="{{ url_for('books.create_review', book_id=book.id) }}">
        <div class="mb-3">
            <label class="form-label" for="rating">Оценка</label>
            <select class="form-select" id="rating" name="rating">
                {% for value, title in ratings %}
                    <option value="{{ value }}" {% if value == 5 %}selected{% endif %}>
                        {{ title }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="text">Текст рецензии</label>
            <textarea class="form-control" id="text" name="text" rows="8" required>{{ request.form.text or '' }}</textarea>
            <div class="form-text">Можно использовать Markdown-разметку.</div>
        </div>

        <button class="btn btn-dark" type="submit">Сохранить</button>
        <a class="btn btn-secondary" href="{{ url_for('books.show', book_id=book.id) }}">Назад</a>
    </form>
</div>
{% endblock %}
